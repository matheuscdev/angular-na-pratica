<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxFlex="900px">
        <form class="mt-60" #clientesFrm="ngForm" (ngSubmit)="salvar()">
            <mat-card appearance="outlined">
                <mat-card-header>
                    <mat-card-title>
                        Dados pessoais
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">
                    <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label>Nome: *</mat-label>
                                <input type="text"
                                       placeholder="Ex.: José da Silva Junior" 
                                       matInput
                                       [(ngModel)]="cliente.nome" 
                                       name="nome" />
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label>Email: *</mat-label>
                                <input type="email"
                                       placeholder="Digite seu melhor email"
                                       matInput
                                       [(ngModel)]="cliente.email"
                                       name="email" />
                            </mat-form-field>
                        </div>
                    </div>

                     <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="250px">
                            <mat-form-field class="full-width">
                                <mat-label>CPF: *</mat-label>
                                <input type="text" 
                                       placeholder="Digite seu CPF" 
                                       matInput 
                                       [(ngModel)]="cliente.cpf"
                                       mask="000.000.000-00"
                                       name="cpf" />
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="250px">
                            <mat-form-field class="full-width">
                                <mat-label>Data de Nascimento: *</mat-label>
                                <input type="text" 
                                       placeholder="Digite sua Data de Nascimento" 
                                       matInput
                                       [(ngModel)]="cliente.dataNascimento"
                                       mask="00/00/0000"
                                       name="dataNascimento" />
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="250px">
                            <mat-form-field class="full-width">
                                <mat-label>UF: *</mat-label>
                                <mat-select [(value)]="cliente.estado" (selectionChange)="carregarMunicipios($event)">
                                    <mat-option *ngFor="let uf of listaDeEstados" [value]="uf.sigla">
                                        {{ uf.sigla }} - {{ uf.nome }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLaoytAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="250px">
                            <mat-form-field class="full-width">
                                <mat-label>Município: *</mat-label>
                                <mat-select [(value)]="cliente.municipio">
                                    <mat-option *ngFor="let m of listaDeMunicipios" [value]="m.nome">
                                        {{ m.nome }}
                                    </mat-option>
                                </mat-select>
                            </mat-form-field>
                        </div>
                    </div>


                </mat-card-content>
                <mat-card-actions>
                    @if (!atualizando) {
                        <button mat-flat-button color="primary" type="submit">
                            <mat-icon fontIcon="save"></mat-icon>
                            Salvar
                        </button>
                    } @else {
                        <button mat-flat-button color="primary">
                            <mat-icon fontIcon="refresh"></mat-icon>
                            Atualizar
                        </button>
                    }
                    <button mat-flat-button color="accent" class="ml-5">
                        <mat-icon fontIcon="backspace"></mat-icon>
                        Limpar
                    </button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>
